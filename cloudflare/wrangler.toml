# Tiantasks shared board. deploy.sh fills in database_id on the first run.
name = "tiantasks"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

rules = [{ type = "Text", globs = ["**/*.html", "**/*.txt"], fallthrough = true }]

[[d1_databases]]
binding = "DB"
database_name = "tiantasks"
database_id = "8a2ed7b9-8318-449f-aee8-5dabd7870d12"

# People who can delete comments (comma-separated login names).
[vars]
TIANTASKS_ADMINS = "tianli"
