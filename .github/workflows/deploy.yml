# Ship the shared board to Cloudflare on every push to main, so it always runs the latest code.
# Needs repo secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers" plus D1 Edit)
# and CLOUDFLARE_ACCOUNT_ID. Login tokens (TIANTASKS_USERS) stay a Worker secret and aren't touched.
name: Deploy shared board

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Build
        run: npm ci --no-audit --no-fund && ./build.sh
      - name: Migrate database
        run: npx wrangler d1 execute tiantasks --remote --file schema.sql --yes
      - name: Deploy
        run: npx wrangler deploy 2>&1 | tee deploy.log
      - name: Verify the live board runs this commit's version
        run: |
          url="$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          want="$(grep -oE '^VERSION = "[^"]+"' ../tiantasks | cut -d'"' -f2)"
          for _ in $(seq 1 12); do
            got="$(curl -fsS "$url/api/ping" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
            [ "$got" = "$want" ] && { echo "$url is running $got"; exit 0; }
            sleep 5
          done
          echo "::error::$url reports version '$got', expected '$want'"
          exit 1
